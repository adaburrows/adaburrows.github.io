{{- /* {{< mermaid >}}graph TD; A-->B{{< /mermaid >}}; the diagram follows the light/dark choice. */ -}}
{{- if not (.Page.Store.Get "mermaidJS") }}{{ .Page.Store.Set "mermaidJS" true -}}
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
const dark = document.documentElement.getAttribute("data-theme") === "dark";
mermaid.initialize({ startOnLoad: true, theme: dark ? "dark" : "neutral", fontFamily: "Spinnaker, sans-serif" });
</script>
{{- end }}
<pre class="mermaid">{{ trim .Inner "\n" | htmlEscape }}</pre>
