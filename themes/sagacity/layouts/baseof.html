<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="masthead">
  {{- partial "header.html" . }}
  {{- partial "nav.html" . }}
  </div>
  <main id="content">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
  {{- with resources.Get "js/site.js" | minify | fingerprint }}
  <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
  {{- end }}
</body>
</html>
