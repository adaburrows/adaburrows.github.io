{{ define "main" }}
<article class="content-area">
  <header class="page-head"><h1>{{ .Title }}</h1></header>
  <ul class="section-list">
    {{- range .Data.Terms.ByCount }}
    <li><a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a> <span class="meta">{{ .Count }}</span></li>
    {{- end }}
  </ul>
</article>
{{ end }}
