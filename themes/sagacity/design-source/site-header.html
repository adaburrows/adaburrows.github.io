<header class="strip" id="top">
  <div class="wrap">
    <div class="heading">
      <h1>{{TITLE}}</h1>
      <h3>{{SUBTITLE}}</h3>
      {{META}}
      <button class="toggle" id="theme" type="button" aria-pressed="false">Dark</button>
    </div>
    <img class="logo logo-light" src="data:image/png;base64,{{LOGO}}" alt="Creative Sagacity" title="Conceptor, Connector, Conductor of Creative Sagacity">
    <img class="logo logo-dark" src="data:image/png;base64,{{LOGO_DARK}}" alt="Creative Sagacity" title="Conceptor, Connector, Conductor of Creative Sagacity">
  </div>
</header>
