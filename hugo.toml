baseURL = "https://adaburrows.com/"
locale = "en-US"
title = "Jillian Ada Burrows"
theme = "sagacity"
enableGitInfo = true
enableRobotsTXT = false

[pagination]
  pagerSize = 1000

[taxonomies]
  category = "categories"

[params]
  subtitle = "Creative Sagacity"
  description = "Jillian Ada Burrows: software engineer, writer, mathematician, musician."
  repo = "https://github.com/adaburrows/adaburrows.github.io"
  avatar = "https://s.gravatar.com/avatar/44645c684eb67fc38f700fdf5ff4ff2c?s=400"

  # Shown on the home page and in the footer.
  [[params.social]]
    name = "GitHub"
    icon = "github-square"
    url = "https://github.com/adaburrows/"
  [[params.social]]
    name = "Medium"
    icon = "medium"
    url = "https://medium.com/@adaburrows"
  [[params.social]]
    name = "Bluesky"
    icon = "bluesky"
    url = "https://bsky.app/profile/adaburrows.bsky.social"
  [[params.social]]
    name = "LinkedIn"
    icon = "linkedin"
    url = "https://www.linkedin.com/in/adaburrows/"
  [[params.social]]
    name = "Instagram"
    icon = "instagram"
    url = "https://instagram.com/adaburrows"
  [[params.social]]
    name = "Facebook"
    icon = "facebook-square"
    url = "https://www.facebook.com/jillburrows.writer/"
  [[params.social]]
    name = "Twitter / X"
    icon = "twitter-square"
    url = "https://twitter.com/jburrows"
  [[params.social]]
    name = "Telegram"
    icon = "telegram"
    url = "https://t.me/adaburrows"
  [[params.social]]
    name = "Discord"
    icon = "discord"
    url = "https://discord.gg/mgtQBHV"

# One menu, the same on every screen size. Entries with children render as
# CSS-only dropdowns (<details>); the rest are plain links.
[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 1
    [menus.main.params]
      icon = "home"
  [[menus.main]]
    name = "Writing"
    pageRef = "/writing"
    weight = 10
  [[menus.main]]
    name = "Explorations"
    identifier = "books"
    weight = 20
  [[menus.main]]
    name = "The Emergence of Culture"
    pageRef = "/docs/narrative-culture"
    parent = "books"
    weight = 1
    [menus.main.params]
      note = "How shared experience forms culture"
  [[menus.main]]
    name = "A Matter of Programming"
    pageRef = "/docs/nkp"
    parent = "books"
    weight = 2
    [menus.main.params]
      note = "What programming is really about"
  [[menus.main]]
    name = "Ice Age Map"
    pageRef = "/docs/ice-age"
    weight = 30
  [[menus.main]]
    name = "About"
    identifier = "about"
    weight = 40
  [[menus.main]]
    name = "Resume"
    pageRef = "/docs/resume"
    parent = "about"
    weight = 2
  [[menus.main]]
    name = "Support my work"
    pageRef = "/support-me"
    parent = "about"
    weight = 3

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
